<style>

  .hidden{display:none!important}
  /* 底部一道手绘田垄，把版面压住，别让下半屏空着 */

    pointer-events:none;opacity:.5;transform:rotate(-2.5deg);
    background:repeating-linear-gradient(102deg,transparent 0 24px,rgba(44,52,46,.075) 24px 26px)}

     letter-spacing:.06em;line-height:1.1;transform:rotate(-1.5deg);margin:0 0 2px}

  .sub{color:#5d675f;font-size:12.5px;line-height:1.9;margin:0;letter-spacing:.01em}

    padding:0 2px 2px}

       letter-spacing:0;font-variant-numeric:tabular-nums}

  /* 左右幽灵按钮：实心圆、拇指区、按住才亮 */
  .pad{position:fixed;top:62%;transform:translateY(-50%);width:72px;height:110px;
    display:none;align-items:center;justify-content:center;z-index:6;
    border:0;background:transparent;padding:0;box-shadow:none}
  .pad span{display:flex;align-items:center;justify-content:center;position:relative;
    width:66px;height:66px;border-radius:50%;
    background:rgba(249,246,239,.55);border:2px solid rgba(44,52,46,.28);
    transition:background .12s,transform .12s}

    border-left:3.5px solid #4a5a44;border-bottom:3.5px solid #4a5a44;

  #padL{left:2px} #padR{right:2px}

    background:#a8574a;color:#fdf6ec;padding:8px 18px;border-radius:3px;

    border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid #a8574a}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough">
  <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="9" result="n"/>

<audio id="bgm" src="audio/bgm.mp3" loop preload="auto"></audio>
<canvas id="c"></canvas>

<div id="menu" class="screen">

      <canvas id="hero" width="380" height="520"></canvas>
      <div class="poster-main">
        <p class="sub">按住左右转向，采药<br>石头木桶别撞，少一颗心<br>46 秒后园丁放狗<br>钻篱笆缝能把他卡住</p>

<script>
"use strict";
/* ============================================================
   药圃跑酷 —— 单文件原型
   视角：正俯视；主角在屏幕上方，朝下方跑，田垄向上滚。
   规范：所有可调数值都在 CFG 里；渲染坐标系以「舞台」左上角为原点。
   ============================================================ */

const CFG = {
  threshold: 2027,        // 抽奖门槛分（总分 = 米数 + 药材分）
  lives: 3,               // 挑战模式命数
  livesEndless: 6,        // 无尽模式命数
  boostTime: 2.6,         // 吃到「健步散」后的加速时长（秒）
  boostMul: 1.45,         // 加速时的速度倍率
  lateralSpeed: 1.35,     // 横向转向速度：每秒走过 1.35 个屏宽
  playPad: 26,            // 玩家左右能到的最边缘（也是物件生成的最边缘）
  hurtSlow: 0.60,         // 撞击后减速倍率
  hurtSlowTime: 0.35,
  invincible: 1.4,        // 撞击后无敌时间
  baseSpeed: 0.48,        // 基础速度：每秒走过 0.48 个屏幕高
  speedStep: 0.045,       // 每 speedEvery 秒 +4.5%
  speedEvery: 12,
  speedCap: 1.30,
  powerEvery: 13,         // 特殊道具（CAB / 农）生成间隔（秒）
  cabTime: 2.0,           // CAB：无敌冲刺时长（秒）
  cabMul: 1.55,           // CAB：冲刺期间的速度倍率
  herbEvery: 0.58,        // 药材生成间隔（秒）
  herbEveryMin: 0.38,
  rockEvery: 1.95,        // 障碍生成间隔（秒）
  rockEveryMin: 0.86,
  itemGap: 210,           // 两个物件之间至少隔多少像素
  gateEvery: 11,          // 窄口多久出现一次
  gateGap: 340,           // 窄口前后至少隔多少像素（比普通物件更宽）
  chaseStart: 46,         // 第几秒放狗
  catchTime: 100,         // 第几秒一定会被追上（固定，不受窄口影响）
  chaseInY: 0.145,        // 放狗时园丁进场的高度（屏幕高占比，HUD 下方，一进来就看得见）
  chaseRush: 0.70,        // 追击进度到多少后他才真的开始逼近（之前只是压在上方）
  chaseBump: 3,           // 站着时的小幅晃动（像素），免得看着像静止贴图
  chasePull: 1.6,         // 园丁被甩开后追回时间表的速度（1/秒）
  stallBase: 1.2,         // 窄口第一次卡住园丁的时长（秒）
  stallGrow: 0.02,        // 每过一秒，卡住时长再加这么多（越到后期卡得越久）

  pxPerMeter: 0.040,      // 多少屏幕高算 1 米
  lanes: 5,               // 生成时对齐的列数
};

/* 窄口可行性的数学依据（为什么不会被逼死）：
   1) 障碍物之间至少隔 itemGap(210px)，窄口前后隔 gateGap(340px)
      —— 按 400px/s 算就是 0.85 秒反应时间，足够侧移一次；
   2) 窄口净宽 84px 起步：玩家碰撞半径 16.8px + 篱笆 26px，
      实际可站窗口 = 84/2 + 26 - 42.8 ≈ ±29px，永远过得去；
   3) 园丁按时间推进：第 chaseStart 秒进场（落地就在画面里），第 catchTime 秒追上，
      与窄口触发次数无关 —— 窄口只让他暂时落后（画面可见），不会造成必然失败，
      也不会让玩家无限续命。
*/

const HERBS = [
  { name: "枸杞", pts: 50, kind: "berry",  color: "#c0392b" },
  { name: "当归", pts: 50, kind: "root",   color: "#a9793f" },
  { name: "薄荷", pts: 50, kind: "leaf",   color: "#5c9a52" },
  { name: "黄芪", pts: 50, kind: "root",   color: "#c9a227" },
  { name: "甘草", pts: 50, kind: "stick",  color: "#b08a5a" },
  { name: "菊花", pts: 50, kind: "flower", color: "#e8b33a" },
  { name: "灵芝", pts: 200, kind: "fungus", color: "#8c3a2e", rare: true },
  { name: "人参", pts: 200, kind: "ginseng",color: "#e0cfa8", rare: true },
];
const ROCKS = ["rock", "fence", "scarecrow", "bucket"];

/* ---------- 画布与舞台 ---------- */
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");
const PIXEL_BUDGET = 1150000;        // 画布最多画多少设备像素
let quality = 1;                     // 自适应画质：1 = 满，低了就少画像素
let qualityStrikes = 0;              // 已经降过几档
function computeDPR() {
  const cssPx = Math.max(1, window.innerWidth * window.innerHeight);
  const budget = Math.sqrt(PIXEL_BUDGET / cssPx);
  const base = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, budget));
  // 手机上真正的开销是「每帧要填多少像素」，不是我的绘制代码；
  // 所以性能不够时最有效的手段就是把渲染分辨率往下压。
  return Math.max(0.7, base * quality);
}
let DPR = 1, W = 0, H = 0;          // 视口
let ST = { x: 0, w: 0 };            // 舞台（桌面端居中收窄）
const STAGE_MAX = 560;

function resize() {
  DPR = computeDPR();
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = Math.min(W, STAGE_MAX);
  ST.w = w; ST.x = Math.round((W - w) / 2);
  // 只有宽度变了才重铺瓦片：手机上地址栏收起会频繁触发 resize（只变高度），
  // 不加这个判断每次都会重建整张地面，反而卡顿。
  if (w !== tileW) { tileW = w; groundTile = null; hudGrad = null; sprites.clear(); }
  if (G.player) G.player.y = Math.round(H * 0.30);
}
window.addEventListener("resize", resize);

/* ---------- 音效（无素材，纯合成） ---------- */
let AC = null;
function audioReady() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === "suspended") AC.resume();
  if (AC) startMusic();
}
function beep(f, dur, type = "sine", vol = 0.09, f2 = null) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  pick: () => beep(880, 0.09, "sine", 0.07, 1320),
  rare: () => { beep(660, 0.1, "triangle", 0.09); setTimeout(() => beep(990, 0.14, "triangle", 0.09), 80); },
  hit:  () => beep(150, 0.26, "square", 0.10, 60),
  boost:() => beep(420, 0.18, "sawtooth", 0.05, 900),
  bark: () => { beep(220, 0.1, "square", 0.06, 140); setTimeout(() => beep(200, 0.1, "square", 0.06, 130), 130); },
  over: () => { beep(320, 0.18, "triangle", 0.08); setTimeout(() => beep(220, 0.3, "triangle", 0.08), 150); },
};

/* ---------- 背景音乐 ----------
   五声音阶的小循环，用 WebAudio 现场合成：
   不需要下载、不存在版权问题（自写音符），也能无缝循环。
   想换成 mp3 的话，把 <audio> 接进来即可。
*/
const MUSIC = { on: false, proc: false, step: 0, next: 0, timer: null, bus: null, muted: false, el: null };
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];      // 宫调五声 + 高八度
const BASE_FREQ = 261.63;                        // C4
const MELODY = [0, 2, 4, 7, 4, 2, 0, 2, 4, 7, 9, 7, 4, 2, 0, -1];
const BASS = [0, -1, -1, 4, -1, -1, 7, -1, 0, -1, -1, 4, -1, 7, -1, -1];

function pluck(time, freq, dur, vol, type) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g); g.connect(MUSIC.bus);
  o.start(time); o.stop(time + dur + 0.05);
}
// 有音乐文件就放文件；加载失败 / 打不开就退回现场合成
function startMusic() {
  if (MUSIC.on) return;
  MUSIC.on = true;
  const el = document.getElementById("bgm");
  if (!el) { startProcedural(); return; }
  MUSIC.el = el;
  el.volume = 0.38;
  el.muted = MUSIC.muted;
  el.addEventListener("error", startProcedural);
  const p = el.play();
  if (p && p.catch) p.catch(() => startProcedural());
}
function startProcedural() {
  if (!AC || MUSIC.proc) return;
  MUSIC.proc = true;
  MUSIC.bus = AC.createGain();
  MUSIC.bus.gain.value = MUSIC.muted ? 0 : 0.5;
  MUSIC.bus.connect(AC.destination);
  MUSIC.next = AC.currentTime + 0.15;
  MUSIC.timer = setInterval(scheduleMusic, 120);
}
function scheduleMusic() {
  if (!MUSIC.on || !AC) return;
  const stepDur = 0.34;
  while (MUSIC.next < AC.currentTime + 0.5) {
    const i = MUSIC.step % 16;
    const m = MELODY[i];
    if (m >= 0) pluck(MUSIC.next, BASE_FREQ * Math.pow(2, PENTA[m] / 12), 0.9, 0.12, "triangle");
    const b = BASS[i];
    if (b >= 0) pluck(MUSIC.next, BASE_FREQ * Math.pow(2, (PENTA[b] - 12) / 12), 1.4, 0.10, "sine");
    MUSIC.next += stepDur;
    MUSIC.step++;
  }
}
function toggleMute() {
  MUSIC.muted = !MUSIC.muted;
  if (MUSIC.bus) MUSIC.bus.gain.value = MUSIC.muted ? 0 : 0.5;
  if (MUSIC.el) MUSIC.el.muted = MUSIC.muted;
  toast(MUSIC.muted ? "静音" : "开声音");
}

/* ---------- 菜单主视觉：大号采药人 ----------
   评审说菜单"没有一个形象、像 flex 居中的网页"，这里补上画面主体。
*/
function drawHero() {
  const hc = document.getElementById("hero");
  if (!hc) return;
  const g = hc.getContext("2d");
  const W2 = hc.width, H2 = hc.height;
  g.clearRect(0, 0, W2, H2);
  g.save();
  g.translate(W2 * 0.5, H2 * 0.78);
  g.scale(3.1, 3.1);

  // 地面：两道手绘墨线
  g.strokeStyle = "rgba(44,52,46,.55)"; g.lineWidth = 1.5; g.lineCap = "round";
  g.beginPath(); g.moveTo(-46, 30); g.quadraticCurveTo(-20, 27, 8, 30); g.quadraticCurveTo(28, 32, 46, 29); g.stroke();
  g.strokeStyle = "rgba(44,52,46,.22)";
  g.beginPath(); g.moveTo(-34, 35); g.quadraticCurveTo(-10, 33, 22, 35); g.stroke();

  const ink2 = (w) => { g.strokeStyle = "#2c342e"; g.lineWidth = w; g.lineJoin = "round"; g.lineCap = "round"; };
  const rr = (x, y, w, h, r) => {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  };

  // 腿
  ink2(2.6);
  g.fillStyle = "#2f4a3e";
  rr(-11, 10, 9, 20, 4.5); g.fill(); g.stroke();
  rr(3, 12, 9, 18, 4.5); g.fill(); g.stroke();
  // 布鞋
  g.fillStyle = "#c8bda6";
  rr(-13, 27, 14, 6, 3); g.fill(); g.stroke();
  rr(2, 27, 14, 6, 3); g.fill(); g.stroke();

  // 身体（青布衫）
  g.fillStyle = "#4b7a63";
  rr(-16, -16, 32, 32, 11); g.fill(); g.stroke();
  // 腰带
  g.fillStyle = "#c9a86b";
  rr(-16, 2, 32, 6, 3); g.fill(); g.stroke();

  // 背上的药篓（偏左，露出三株药材）
  g.save(); g.translate(-19, -2);
  g.fillStyle = "#c09a63";
  rr(-10, -12, 20, 24, 7); g.fill(); g.stroke();
  ink2(1.6);
  for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 6, -11); g.lineTo(i * 6, 11); g.stroke(); }
  // 药材叶子
  g.fillStyle = "#6b9c5c";
  g.beginPath(); g.ellipse(-3, -17, 6, 3, -0.5, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.ellipse(5, -19, 6, 3, 0.4, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "#c0392b";
  g.beginPath(); g.arc(-6, -20, 2.6, 0, 7); g.fill(); g.stroke();
  g.restore();

  // 右手扛锄头
  ink2(2.4);
  g.strokeStyle = "#8a6b45"; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(20, 28); g.lineTo(27, -16); g.stroke();
  g.fillStyle = "#9aa0a6";
  g.beginPath();
  g.moveTo(27, -16); g.lineTo(36, -19); g.lineTo(34, -11); g.lineTo(26, -9);
  g.closePath(); g.fill();
  ink2(2); g.stroke();

  // 手臂
  g.fillStyle = "#f0cfa9"; ink2(2.6);
  g.beginPath(); g.arc(-19, -6, 4.6, 0, 7); g.fill(); g.stroke();
  g.beginPath(); g.arc(19, -4, 4.6, 0, 7); g.fill(); g.stroke();

  // 头
  g.fillStyle = "#f2d3b3";
  g.beginPath(); g.arc(0, -28, 12, 0, 7); g.fill(); g.stroke();
  // 斗笠
  g.fillStyle = "#d9b878";
  g.beginPath();
  g.moveTo(-24, -31); g.quadraticCurveTo(0, -46, 24, -31);
  g.quadraticCurveTo(0, -25, -24, -31); g.closePath();
  g.fill(); g.stroke();
  ink2(1.6); g.strokeStyle = "rgba(44,52,46,.5)";
  g.beginPath(); g.moveTo(-14, -33); g.quadraticCurveTo(0, -37, 14, -33); g.stroke();
  // 笠尖
  g.fillStyle = "#c9a86b"; ink2(2.2); g.strokeStyle = "#2c342e";
  g.beginPath(); g.moveTo(-5, -40); g.quadraticCurveTo(0, -47, 5, -40); g.closePath(); g.fill(); g.stroke();

  // 墨点
  g.fillStyle = "rgba(44,52,46,.18)";
  for (const p of [[-40, -12, 2.2], [38, 8, 1.8], [30, -46, 1.6], [-30, 22, 1.4]]) {
    g.beginPath(); g.arc(p[0], p[1], p[2], 0, 7); g.fill();
  }
  g.restore();
}

/* ---------- 工具 ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
function lerp(a, b, k) { return a + (b - a) * k; }
function laneX(i) {
  // 生成点铺满「玩家能到的整个横向范围」，包括最左最右。
  // 旧版只在中间缩进一圈，玩家贴边就永远撞不到东西。
  const p = CFG.playPad;
  const n = Math.max(1, CFG.lanes - 1);
  return p + (ST.w - p * 2) * (i / n);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const INK = "#2c342e";
function ink(w = 3) { ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.lineCap = "round"; }

/* ---------- 地面 ----------
   性能要点：田垄不再每帧现画路径，而是预渲染成一张「瓦片」，
   每帧只做 3~4 次 drawImage。scroll 也对瓦片高度取模，
   所以跑多久都不会变慢（旧版循环随 scroll 增长，越跑越卡）。
*/
const BAND = 104;
const BANDS_PER_TILE = 6;
const TILE_H = BAND * BANDS_PER_TILE;
let groundTile = null;
let tileW = -1;

function grassOn(g, x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.strokeStyle = "rgba(112,146,96,.55)"; g.lineWidth = 2.2; g.lineCap = "round";
  for (const a of [-0.5, 0, 0.5]) {
    g.beginPath(); g.moveTo(0, 4);
    g.quadraticCurveTo(a * 8, -3, a * 13, -10);
    g.stroke();
  }
  g.restore();
}

function buildGroundTile() {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(ST.w * DPR));
  c.height = Math.max(1, Math.round(TILE_H * DPR));
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = "#eef3e2"; g.fillRect(0, 0, ST.w, TILE_H);

  // 垄是竖的：人顺着垄沟往前跑，所以垄线应该跟跑动方向平行
  // 垄宽故意不等（74~112），像人工推出来的，不像贴图阵列
  const rows = [];
  for (let x = -46; x < ST.w + 60;) {
    const w = 74 + ((Math.abs(x) * 7919) % 39);
    rows.push({ x, w });
    x += w;
  }
  for (let i = 0; i < rows.length; i++) {
    // 垄面：一条亮一条暗，明暗差要大一点才看得出"这是一垄一垄的地"
    g.fillStyle = i % 2 ? "#d9e7c3" : "#e9f0d9";
    g.fillRect(rows[i].x, 0, rows[i].w, TILE_H);
    // 垄上土色：靠垄脊渐深，像被踩实的沟
    const gr = g.createLinearGradient(rows[i].x, 0, rows[i].x + rows[i].w, 0);
    gr.addColorStop(0, "rgba(168,158,120,.2)");
    gr.addColorStop(.5, "rgba(176,168,132,0)");
    gr.addColorStop(1, "rgba(168,158,120,.2)");
    g.fillStyle = gr; g.fillRect(rows[i].x, 0, rows[i].w, TILE_H);
  }
  // 垄脊：竖向波浪线，周期整除瓦片高度，接缝看不出来
  g.lineCap = "round"; g.lineJoin = "round";
  for (let i = 0; i < rows.length; i++) {
    const bx = rows[i].x, heavy = i % 3 === 0;
    g.strokeStyle = heavy ? "rgba(112,134,96,.52)" : "rgba(112,134,96,.34)";
    g.lineWidth = heavy ? 3.4 : 2.4;
    g.beginPath();
    for (let y = -16; y <= TILE_H + 16; y += 20) {
      const xx = bx
        + Math.sin(y / TILE_H * Math.PI * 6 + i) * 3.4
        + Math.sin(y / TILE_H * Math.PI * 14 + i * 2) * 1.1;
      y === -16 ? g.moveTo(xx, y) : g.lineTo(xx, y);
    }
    g.stroke();
  }
  // 垄上种的东西：每垄沿中线点两排小苗，滚动时才看得出地在动
  for (let i = 0; i < rows.length; i++) {
    if (i % 2) continue;                       // 隔一垄种一垄，别排成阵列
    const cx = rows[i].x + rows[i].w * 0.5;
    for (let s = 0; s < 3; s++) {
      if ((i * 7 + s * 5) % 4 === 0) continue;  // 缺株，手种的地不会满
      const yy = (s + 0.4) * (TILE_H / 3) + ((i * 53 + s * 29) % 31) - 15;
      const xx = cx + ((i * 37 + s * 71) % 19) - 9;
      g.strokeStyle = "rgba(84,116,72,.62)"; g.lineWidth = 2.4; g.lineCap = "round";
      g.beginPath();
      g.moveTo(xx, yy + 5); g.quadraticCurveTo(xx - 5, yy - 1, xx - 4, yy - 6);
      g.moveTo(xx, yy + 5); g.quadraticCurveTo(xx + 5, yy - 1, xx + 4, yy - 5);
      g.stroke();
    }
  }
  // 垄沟里的细节：杂草、土块、碎秸秆 —— 这些才是滚动感的来源
  for (let i = 0; i < BANDS_PER_TILE; i++) {
    const by = i * BAND;
    for (let k = 0; k < 4; k++) {
      const hx = ((i * 173 + k * 211) % 997) / 997 * ST.w;
      const hy = by + ((i * 97 + k * 149) % 991) / 991 * BAND;
      if (k === 0) grassOn(g, hx, hy, 0.72 + (i % 3) * 0.1);
      else if (k === 1) {
        g.fillStyle = "rgba(150,138,110,.34)";
        g.beginPath(); g.ellipse(hx, hy, 4.2, 2.6, 0.4, 0, 7); g.fill();
      } else {
        g.strokeStyle = "rgba(160,142,96,.42)"; g.lineWidth = 1.8;
        g.beginPath();
        g.moveTo(hx, hy); g.lineTo(hx + 5 - (k * 2), hy - 5);
        g.stroke();
      }
    }
    // 纸纹颗粒
    for (let d = 0; d < 22; d++) {
      const px = ((i * 73 + d * 37) % 1000) / 1000 * ST.w;
      const py = by + ((i * 61 + d * 91) % 1000) / 1000 * BAND;
      g.fillStyle = d % 3 ? "rgba(120,110,90,.05)" : "rgba(90,80,60,.07)";
      g.fillRect(px, py, 1.6, 1.6);
    }
  }
  // 两侧田埂（石边），让画面有边界
  g.fillStyle = "rgba(196,186,164,.5)";
  g.fillRect(0, 0, 10, TILE_H); g.fillRect(ST.w - 10, 0, 10, TILE_H);
  groundTile = c;
}

function drawGround() {
  if (!groundTile) buildGroundTile();
  // 对齐到整数像素：亚像素贴图会走重采样，比 1:1 拷贝慢好几倍
  const off = Math.floor(((G.scroll % TILE_H) + TILE_H) % TILE_H);
  // 每帧只需要 2~3 次 drawImage，且数量与跑了多久无关
  for (let y = -off; y < H; y += TILE_H) {
    ctx.drawImage(groundTile, 0, y, ST.w, TILE_H);
  }
}

/* ---------- 贴图缓存 ----------
   药材、障碍的形状每帧现画（几十条路径 + 描边），在手机上是最贵的一块。
   这里各画一次存成小贴图，之后每帧只 drawImage。
*/
const SPRITE = 84;                 // 贴图边长（CSS px）
const sprites = new Map();

function makeSprite(key, draw) {
  const c = document.createElement("canvas");
  c.width = Math.round(SPRITE * DPR); c.height = Math.round(SPRITE * DPR);
  const g = c.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.translate(SPRITE / 2, SPRITE / 2);   // 图形以中心为原点
  const save = ctx; ctx = g;
  try { draw(); } finally { ctx = save; }
  sprites.set(key, c);
  return c;
}
function herbSprite(data) {
  const key = "h:" + data.name;
  return sprites.get(key) || makeSprite(key,
    () => herbArt({ x: 0, y: 0, data, seed: 0 }, { s: data.rare ? 1.2 : 1.02 }));
}
function rockSprite(type) {
  const key = "r:" + type;
  return sprites.get(key) || makeSprite(key,
    () => rockArt({ x: 0, y: 0, data: { type } }));
}
// 健步散：一只药葫芦
function boostSprite() {
  const key = "b:gourd";
  return sprites.get(key) || makeSprite(key, () => gourdArt());
}
function gourdArt() {
  ink(2.8);
  ctx.fillStyle = "#d9a441";
  ctx.beginPath(); ctx.arc(0, -7, 7.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 7, 10.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#8c3a2e";
  roundRect(-4, -15, 8, 5, 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#b03a2e"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-9.5, -1); ctx.lineTo(9.5, -1); ctx.stroke();
}

/* ---------- 主角（背身、朝下跑） ---------- */
function drawPlayer() {
  const P = G.player;
  const moving = (P.dir || 0) !== 0;
  P.phase += (moving ? 0.28 : 0.2);
  const sw = Math.sin(P.phase) * (moving ? 7 : 4);
  const bob = Math.abs(Math.sin(P.phase)) * 2;

  ctx.save();
  ctx.translate(P.x, P.y + bob);
  ctx.scale(1.12, 1.12);
  // 影子
  ctx.fillStyle = "rgba(70,90,65,.16)";
  ctx.beginPath(); ctx.ellipse(0, 26, 24, 8, 0, 0, 7); ctx.fill();

  if (G.inv > 0 && Math.floor(G.inv * 12) % 2 === 0) ctx.globalAlpha = 0.45;

  ink(3);
  // 腿
  for (const side of [-1, 1]) {
    ctx.fillStyle = "#2f4a3e";
    roundRect(side * 8 - 5, 8 + (side > 0 ? sw : -sw) * 0.4, 10, 17, 5);
    ctx.fill(); ctx.stroke();
  }
  // 身体
  ctx.fillStyle = "#4b7a63";
  roundRect(-13, -14, 26, 30, 11); ctx.fill(); ctx.stroke();
  // 药篓
  ctx.fillStyle = "#c09a63";
  roundRect(-11, -11, 22, 18, 7); ctx.fill(); ctx.stroke();
  ink(2);
  ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(11, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -11); ctx.lineTo(-4, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, -11); ctx.lineTo(4, 7); ctx.stroke();
  ink(3);
  // 手
  ctx.fillStyle = "#f0cfa9";
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.arc(side * 15, -2 - (side > 0 ? sw : -sw) * 0.5, 4.2, 0, 7);
    ctx.fill(); ctx.stroke();
  }
  // 头
  ctx.fillStyle = "#f2d3b3";
  ctx.beginPath(); ctx.arc(0, -22, 10, 0, 7); ctx.fill(); ctx.stroke();
  // 斗笠
  ctx.fillStyle = "#d9b878";
  ctx.beginPath();
  ctx.moveTo(-19, -24); ctx.quadraticCurveTo(0, -34, 19, -24);
  ctx.quadraticCurveTo(0, -20, -19, -24);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-19, -24); ctx.quadraticCurveTo(0, -28, 19, -24); ctx.stroke();

  // 冲刺尾迹
  if (G.boostT > 0) {
    ctx.strokeStyle = "rgba(217,131,36,.55)"; ctx.lineWidth = 3;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 12, -34 - 8); ctx.lineTo(i * 16, -34 - 26 - Math.random() * 10);
      ctx.stroke();
    }
  }
  // CAB 冲刺：蓝色多道残影
  if (G.cabT > 0) {
    ctx.strokeStyle = "rgba(45,108,181,.5)"; ctx.lineWidth = 4;
    for (let i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.moveTo(i * 14, -20); ctx.lineTo(i * 22, -46 - Math.random() * 14);
      ctx.stroke();
    }
  }
  ctx.restore();
  // 护盾：脚下一圈金色圆环，一直在转
  if (G.shield) {
    ctx.save();
    ctx.translate(G.player.x, G.player.y + 18);
    ctx.strokeStyle = "rgba(184,134,11,.85)"; ctx.lineWidth = 3;
    ctx.setLineDash([9, 7]);
    ctx.lineDashOffset = -G.t * 40;
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 11, 0, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

/* ---------- 药材 ---------- */
function herbArt(o, art) {
  const c = o.data;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(art.s, art.s);
  ink(2.6);
  const s = Math.sin(G.t * 3 + o.seed) * 0.06;
  ctx.rotate(s);
  switch (c.kind) {
    case "berry": // 枸杞：三颗红果 + 绿叶
      ctx.fillStyle = "#5c9a52";
      ctx.beginPath(); ctx.ellipse(-8, -6, 7, 4, -0.6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(7, -7, 7, 4, 0.6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = c.color;
      for (const p of [[-6, 2], [5, 0], [0, 7]]) {
        ctx.beginPath(); ctx.arc(p[0], p[1], 5.2, 0, 7); ctx.fill(); ctx.stroke();
      }
      break;
    case "root": // 根类：一块根 + 两片叶
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.moveTo(-4, -10); ctx.quadraticCurveTo(9, -2, 3, 12);
      ctx.quadraticCurveTo(-6, 10, -7, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#5c9a52";
      ctx.beginPath(); ctx.ellipse(-9, -12, 7, 3.5, -0.8, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(4, -13, 7, 3.5, 0.5, 0, 7); ctx.fill(); ctx.stroke();
      break;
    case "leaf": // 叶类
      ctx.fillStyle = c.color;
      for (const a of [-0.7, 0, 0.7]) {
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, -7, 5.5, 10, 0, 0, 7); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      break;
    case "stick": // 甘草：三根枝条
      ctx.strokeStyle = c.color; ctx.lineWidth = 5;
      for (const a of [-0.35, 0.15, 0.5]) {
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(0, -11); ctx.stroke();
        ctx.restore();
      }
      ink(2.6);
      break;
    case "flower": // 菊花：一圈花瓣
      ctx.fillStyle = c.color;
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, -8, 3.4, 6.2, 0, 0, 7); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = "#c98a2e";
      ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, 7); ctx.fill(); ctx.stroke();
      break;
    case "fungus": // 灵芝：扇形菌盖
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.ellipse(0, 2, 13, 9, 0, Math.PI, 0); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#c98a6a";
      ctx.beginPath(); ctx.ellipse(0, 2, 8, 5.5, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#e8d5b0";
      roundRect(-3, 2, 6, 8, 3); ctx.fill(); ctx.stroke();
      break;
    case "ginseng": // 人参：人形根
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(0, -6, 5.5, 0, 7); ctx.fill(); ctx.stroke();
      roundRect(-3.5, -2, 7, 13, 3.5); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(-3, 1); ctx.lineTo(-9, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, 1); ctx.lineTo(9, 7); ctx.stroke();
      ctx.fillStyle = "#5c9a52";
      ctx.beginPath(); ctx.ellipse(0, -14, 4, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
      break;
  }
  ctx.restore();
}

/* ---------- 障碍 ---------- */
function rockArt(o) {
  const d = o.data;
  ctx.save(); ctx.translate(o.x, o.y);
  ink(3);
  if (d.type === "rock") {
    ctx.fillStyle = "#a9a396";
    ctx.beginPath();
    ctx.moveTo(-20, 12); ctx.quadraticCurveTo(-24, -6, -8, -13);
    ctx.quadraticCurveTo(10, -18, 19, -4); ctx.quadraticCurveTo(23, 10, 8, 14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#c4bfb4";
    ctx.beginPath(); ctx.ellipse(-6, -6, 7, 4, -0.4, 0, 7); ctx.fill();
  } else if (d.type === "fence") {
    ctx.strokeStyle = "#8a6b45"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-22, -14); ctx.lineTo(-22, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, -14); ctx.lineTo(22, 14); ctx.stroke();
    ink(3); ctx.strokeStyle = "#a37d4f"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(26, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-26, 6); ctx.lineTo(26, 6); ctx.stroke();
  } else if (d.type === "scarecrow") {
    ctx.strokeStyle = "#8a6b45"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-17, -4); ctx.lineTo(17, -4); ctx.stroke();
    ctx.fillStyle = "#c9a86b";
    roundRect(-9, -14, 18, 20, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#e2c98d";
    ctx.beginPath(); ctx.moveTo(-16, -14); ctx.lineTo(16, -14); ctx.lineTo(0, -26);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else { // bucket
    ctx.fillStyle = "#b07d4b";
    ctx.beginPath(); ctx.ellipse(0, -10, 14, 5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-14, -10); ctx.lineTo(-10, 13); ctx.lineTo(10, 13); ctx.lineTo(14, -10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 追兵 ---------- */
// 园丁 + 狗的画法抽出来，追兵和结算页共用
function gardenerArt(withDog) {
  const bob = Math.sin(G.t * 14) * 2.4;
  // 狗：得看得出是狗 —— 四条腿、尾巴、竖起来的耳朵，还要牵绳
  if (withDog !== false) {
    ctx.save(); ctx.translate(-56, 12 + bob);
    ink(2.6);
    // 牵绳：从园丁手边斜拉到狗脖子
    ctx.strokeStyle = "#6b5b4a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(24, -10); ctx.quadraticCurveTo(14, 2, 8, -4); ctx.stroke();
    // 腿
    ctx.strokeStyle = "#3a2f26"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    for (const lx of [-8, -3, 6, 11]) {
      ctx.beginPath(); ctx.moveTo(lx, 6);
      ctx.lineTo(lx + (lx < 0 ? -1.5 : 1.5), 12 + (lx % 2 ? bob : -bob)); ctx.stroke();
    }
    // 身子 + 尾巴
    ctx.fillStyle = "#a5734a";
    roundRect(-11, -7, 22, 13, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11, -2);
    ctx.quadraticCurveTo(-19, -8 + bob, -16, -12 + bob); ctx.stroke();
    // 头 + 耳朵 + 鼻尖
    ctx.beginPath(); ctx.arc(12, -6, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8a5e3b";
    ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(9, -19); ctx.lineTo(14, -13); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#3a2f26";
    ctx.beginPath(); ctx.arc(19, -6, 1.8, 0, 7); ctx.fill();
    ctx.restore();
  }
  // 园丁：比主角深一号的土褐，戴草帽，站得直
  ink(3);
  ctx.fillStyle = "#5a4a3a";
  roundRect(-13, -8, 26, 26, 9); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#e8c49c";
  ctx.beginPath(); ctx.arc(0, -16, 9, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#cbb277";
  ctx.beginPath(); ctx.moveTo(-17, -18); ctx.quadraticCurveTo(0, -30, 17, -18);
  ctx.quadraticCurveTo(0, -14, -17, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#8a7448";                 // 帽箍，跟主角的帽子区分开
  ctx.fillRect(-11, -20, 22, 3.4);
  ctx.strokeStyle = "#3a2f26"; ctx.lineWidth = 2;   // 手里的竹竿
  ctx.beginPath(); ctx.moveTo(13, -4); ctx.lineTo(22, 16); ctx.stroke();
}

function drawChase() {
  // 被窄口卡住时抖一下，玩家能看出来"它真的减速了"
  const jig = G.stall > 0 ? Math.sin(G.t * 40) * 5 : 0;
  ctx.save();
  ctx.translate((G.chase.x || ST.w / 2) + jig, G.chase.y);
  gardenerArt();
  ctx.restore();
  if (G.chase.stuck) {                 // 标签挂在他头上，跟着他一起滚出画面
    ctx.save();
    ctx.font = "700 12px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(58,110,74,.85)";
    ctx.fillText("卡住", G.chase.x + jig, G.chase.y - 34);
    ctx.restore();
  }
}

// 结算页：把园丁放回来，三屏的叙事别断
function drawOverArt() {
  const c = document.getElementById("heroOver");
  if (!c) return;
  const g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const save = ctx; ctx = g;
  try {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.translate(c.width * 0.5, c.height * 0.58);
    g.scale(3.1, 3.1);
    gardenerArt(false);
  } finally { ctx = save; }
}

/* ---------- HUD ---------- */
let hudGrad = null;
let dangerGrad = null, dangerGradStep = -1;
function heart(x, y, full, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-9, -3, -6, -11, 0, -6);
  ctx.bezierCurveTo(6, -11, 9, -3, 0, 5);
  ctx.closePath();
  if (full) { ctx.fillStyle = "#b03a2e"; ctx.fill(); }
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  const top = 18;
  // 顶部压一层浅色渐变，保证 HUD 在田地上也看得清（渐变对象缓存，不每帧新建）
  if (!hudGrad) {
    hudGrad = ctx.createLinearGradient(0, 0, 0, 96);
    hudGrad.addColorStop(0, "rgba(250,247,240,.97)");
    hudGrad.addColorStop(.72, "rgba(250,247,240,.86)");
    hudGrad.addColorStop(1, "rgba(250,247,240,0)");
  }
  ctx.fillStyle = hudGrad; ctx.fillRect(0, 0, ST.w, 96);

  // 第一行：命（左）
  const lives = Math.max(G.lives, 0);
  for (let i = 0; i < lives; i++) heart(26 + i * 25, top + 10, true);
  if (G.mode === "challenge") {
    for (let i = lives; i < CFG.lives; i++) heart(26 + i * 25, top + 10, false);
  }

  // 第一行：距离（中）
  ctx.font = "600 21px system-ui,sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = INK;
  ctx.fillText(Math.floor(G.meters) + " m", ST.w / 2, top + 18);

  // 距离下方：实时总分 + 门槛进度（总分 = 米数 + 药材分）
  const sc = Math.floor(G.meters) + G.herbPts;
  if (G.mode === "challenge") {
    ctx.font = "700 15px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = sc >= CFG.threshold ? "#3a6e4a" : INK;
    ctx.fillText("总分 " + sc, ST.w / 2, top + 40);
    const prog = clamp(sc / CFG.threshold, 0, 1);
    const bw = 100, bh = 5, bx = ST.w / 2 - bw / 2, by = top + 49;
    ctx.fillStyle = "rgba(44,52,46,.14)"; roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    if (prog > 0) {
      ctx.fillStyle = prog >= 1 ? "#3a6e4a" : "#c0662a";
      roundRect(bx, by, Math.max(bh, bw * prog), bh, bh / 2); ctx.fill();
    }
  }

  // 第二行：药材数（左）／当前增益（右）
  ctx.textAlign = "left";
  ctx.font = "600 13.5px system-ui,sans-serif";
  ctx.fillStyle = "#3a6e4a";
  ctx.fillText("药材 " + G.herbs, 24, top + 64);
  const badges = [];
  if (G.cabT > 0) badges.push({ t: "CAB " + G.cabT.toFixed(1) + "s", c: "#2d6cb5" });
  if (G.shield) badges.push({ t: "护盾", c: "#b8860b" });
  if (G.boostT > 0) badges.push({ t: "加速", c: "#c0662a" });
  ctx.textAlign = "right";
  let bx2 = ST.w - 24;
  for (const b of badges) {
    ctx.fillStyle = b.c;
    ctx.textAlign = "right";
    ctx.fillText(b.t, bx2, top + 64);
    bx2 -= ctx.measureText(b.t).width + 12;
  }
  if (FPSDBG) {
    ctx.textAlign = "left"; ctx.font = "700 12px system-ui,sans-serif";
    ctx.fillStyle = G.fps >= 50 ? "#3a6e4a" : (G.fps >= 40 ? "#d98324" : "#b03a2e");
    ctx.fillText("FPS " + G.fps.toFixed(0) + "  DPR " + DPR.toFixed(2) + "  物件 " + G.objs.length,
      12, H - 12);
  }
  if (AUTO) {
    ctx.textAlign = "left"; ctx.font = "600 12px system-ui,sans-serif"; ctx.fillStyle = "#b03a2e";
    ctx.fillText("AUTO " + Math.floor(G.meters) + "m +" + G.herbPts + " = "
      + (Math.floor(G.meters) + G.herbPts) + "  t=" + G.t.toFixed(0) + "s", 12, H - 12);
  }
}

/* ---------- 生成物 ---------- */
function spawnHerb() {
  const rare = Math.random() < 0.1;
  const data = rare ? pick(HERBS.filter(h => h.rare)) : pick(HERBS.filter(h => !h.rare));
  if (!data) return;
  const i = (Math.random() * CFG.lanes) | 0;
  G.objs.push({ type: "herb", x: laneX(i) + rand(-8, 8), y: H + 60, data, seed: rand(0, 6), r: rare ? 26 : 21 });
}
function spawnRock() {
  const i = (Math.random() * CFG.lanes) | 0;
  G.objs.push({
    type: "rock", x: laneX(i) + rand(-6, 6), y: H + 70,
    data: { type: pick(ROCKS) }, r: 26
  });
}
// 「健步散」：吃到自动加速，不再靠手按
function spawnBoost() {
  const i = (Math.random() * CFG.lanes) | 0;
  G.objs.push({ type: "boost", x: laneX(i), y: H + 70, r: 26, seed: rand(0, 6) });
}
// 特殊道具：CAB（无敌冲刺）和 农（护盾），两种轮换出场
function spawnPower() {
  const i = (Math.random() * CFG.lanes) | 0;
  const kind = (G.powerN++ % 2 === 0) ? "cab" : "nong";
  G.objs.push({ type: "power", kind, x: laneX(i), y: H + 80, r: 30, seed: rand(0, 6) });
}
// 窄口：两段篱笆中间留一道缝，从缝里钻过去能把园丁卡住
function spawnGate() {
  const gapW = Math.max(84, ST.w * 0.24);
  const gapX = rand(ST.w * 0.32, ST.w * 0.68);
  G.objs.push({
    type: "gate", x: gapX, gapW, y: H + 90,
    r: 0, passed: false,
    left: { x: gapX - gapW / 2 - 26, r: 26, type: "fence" },
    right: { x: gapX + gapW / 2 + 26, r: 26, type: "fence" }
  });
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, 1800);
}

/* ---------- 开始 / 结束 ---------- */
function start(mode) {
  audioReady();
  G.mode = mode;
  G.state = "play";
  G.t = 0; G.scroll = 0; G.meters = 0; G.herbs = 0; G.herbPts = 0;
  G.lives = mode === "endless" ? CFG.livesEndless : CFG.lives;
  G.boostT = 0; G.inv = 0; G.slowT = 0; G.shake = 0; G.stall = 0;
  G.cabT = 0; G.shield = false; G.powerN = 0;
  G.spawnPowerT = CFG.powerEvery * 0.55;
  G.spawnHerbT = 0.5; G.spawnRockT = 1.4;
  G.spawnBoostT = CFG.boostEvery; G.spawnGateT = CFG.gateEvery + 6;
  G.obstacleGapLeft = 0;
  G.objs.length = 0; G.fx.length = 0;
  G.chase = { on: false, y: -160, y0: -160, x: ST.w / 2, dogPhase: 0, gate: null, stuck: false, recover: 0 };
  G.warned = false;
  G.player.x = ST.w / 2; G.player.dir = 0; G.player.y = Math.round(H * 0.30);
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  document.getElementById("pause").classList.add("hidden");
  showPads(true);
  beep(520, 0.12, "triangle", 0.07, 780);
}
function gameOver(caught) {
  G.state = "over";
  padHeld.length = 0; canvasDir = 0;
  sfx.over();
  showPads(false);
  const score = Math.floor(G.meters) + G.herbPts;
  const best = Math.max(score, +(localStorage.getItem("yaopu.best") || 0));
  localStorage.setItem("yaopu.best", best);

  document.getElementById("finalScore").textContent = score;
  document.getElementById("rDist").textContent = Math.floor(G.meters);
  document.getElementById("rHerb").textContent = G.herbs;
  document.getElementById("rBest").textContent = "本机最高 " + best;
  document.getElementById("overKicker").textContent = caught ? "被老张追上了" : "药材篓翻了";

  const v = document.getElementById("verdict");
  if (G.mode === "endless") {
    v.className = "badge pass"; v.textContent = "无尽模式 · 不计门槛";
  } else if (score >= CFG.threshold) {
    v.className = "badge pass";
    v.textContent = "达标 " + CFG.threshold + " · 记得传截图";
  } else {
    v.className = "badge fail";
    v.textContent = "差 " + (CFG.threshold - score) + " 分";
  }
  document.getElementById("over").classList.remove("hidden");
  drawOverArt();
}

/* ---------- 输入 ----------
   转向 = 一直按住改变方向（左半屏 / 右半屏），横移速度恒定。
   参考游戏也是这样：只能改方向，不能瞬移到点击位置。
*/
let dragging = false, canvasDir = 0;
// 两个侧边按钮可以同时按住：最后按下的那个说了算，松开它就回到还按着的那个。
const padHeld = [];
function padDir() { return padHeld.length ? padHeld[padHeld.length - 1].dir : 0; }
function holdPad(id, dir) {
  const i = padHeld.findIndex(p => p.id === id);
  if (i >= 0) padHeld.splice(i, 1);
  padHeld.push({ id, dir });
}
function releasePad(id) {
  const i = padHeld.findIndex(p => p.id === id);
  if (i >= 0) padHeld.splice(i, 1);
}
function sideOf(clientX) { return clientX < ST.x + ST.w / 2 ? -1 : 1; }
cv.addEventListener("pointerdown", e => {
  audioReady();
  if (G.state !== "play") return;
  dragging = true;
  canvasDir = sideOf(e.clientX);
});
cv.addEventListener("pointermove", e => {
  if (G.state !== "play" || !dragging) return;
  canvasDir = sideOf(e.clientX);
});
function endSteer() { dragging = false; canvasDir = 0; }
window.addEventListener("pointerup", endSteer);
window.addEventListener("pointercancel", endSteer);

const keys = {};
window.addEventListener("keydown", e => {
  audioReady();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === "Escape" && G.state === "play") togglePause();
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === "Enter" && G.state === "over") start(G.mode);
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

// 加速现在只来自地图上的「健步散」，吃到即触发
function grantBoost() {
  if (G.state !== "play") return;
  G.boostT = CFG.boostTime;
  sfx.boost();
}

// 特殊道具：CAB = 无敌冲刺 2 秒；农 = 护盾，顶一次伤害
function grantPower(kind) {
  if (G.state !== "play") return;
  if (kind === "cab") {
    G.cabT = CFG.cabTime;
    toast("CAB！两秒无敌，撞开一条路");
    G.fx.push({ x: G.player.x, y: G.player.y - 30, txt: "无敌 2s", life: 1.1, color: "#2d6cb5" });
  } else {
    G.shield = true;
    toast("农 · 护盾替您挡一次");
    G.fx.push({ x: G.player.x, y: G.player.y - 30, txt: "护盾", life: 1.1, color: "#b8860b" });
  }
  sfx.rare();
}

// 统一扣血入口：CAB 期间免伤，护盾顶一次，其余正常掉一颗心
function hurtPlayer() {
  if (G.cabT > 0) return false;
  if (G.shield) {
    G.shield = false;
    G.inv = CFG.invincible * 0.6;
    G.shake = 6;
    G.fx.push({ x: G.player.x, y: G.player.y - 26, txt: "盾挡住", life: 0.9, color: "#b8860b" });
    beep(520, 0.12, "triangle", 0.06, 300);
    return false;
  }
  G.lives--; G.inv = CFG.invincible; G.slowT = CFG.hurtSlowTime;
  G.shake = 12; sfx.hit();
  G.fx.push({ x: G.player.x, y: G.player.y - 20, txt: "-1", life: 0.9, color: "#b03a2e" });
  return true;
}

// ---- 左右幽灵按钮 ----
const padL = document.getElementById("padL");
const padR = document.getElementById("padR");
function showPads(on) {
  const d = on ? "flex" : "none";
  padL.style.display = d; padR.style.display = d;
}
[[padL, -1], [padR, 1]].forEach(([el, dir]) => {
  const down = e => {
    e.preventDefault(); e.stopPropagation();
    audioReady();
    if (G.state === "play") { holdPad(el.id, dir); dragging = false; canvasDir = 0; }
  };
  const up = e => { e.preventDefault(); releasePad(el.id); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
});

document.querySelectorAll("[data-mode]").forEach(b => {
  b.addEventListener("click", () => start(b.dataset.mode));
});
document.getElementById("again").addEventListener("click", () => start(G.mode));
document.getElementById("toMenu").addEventListener("click", () => {
  G.state = "menu";
  document.getElementById("over").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
  showPads(false);
});
document.getElementById("pause").addEventListener("click", togglePause);
function togglePause() {
  if (G.state === "play") { G.state = "pause"; document.getElementById("pause").classList.remove("hidden"); }
  else if (G.state === "pause") { G.state = "play"; document.getElementById("pause").classList.add("hidden"); }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden && G.state === "play") togglePause();
});

/* ---------- 主循环 ---------- */
let last = performance.now();
let qAcc = 0, qN = 0;

// 降一档画质（重建瓦片和贴图，之后按新分辨率走）
function degradeQuality() {
  if (qualityStrikes >= 3) return;
  qualityStrikes++;
  quality *= 0.8;
  groundTile = null; hudGrad = null; sprites.clear();
  resize();
  if (window.__prof) window.__prof.degraded = qualityStrikes;
}
const FPSDBG = new URLSearchParams(location.search).get("fps") === "1";
// ?prof=1 —— 分项计时，配合 CDP 读取 window.__prof（开发用）
const PROF = new URLSearchParams(location.search).get("prof") === "1";
if (PROF) {
  window.__prof = { frames: 0, total: 0, draw: 0, ground: 0, player: 0, hud: 0, chase: 0 };
  const wrapTiming = (key, fn) => function () {
    const t0 = performance.now();
    try { return fn.apply(this, arguments); }
    finally { window.__prof[key] += performance.now() - t0; }
  };
  drawGround = wrapTiming("ground", drawGround);
  drawPlayer = wrapTiming("player", drawPlayer);
  drawHUD = wrapTiming("hud", drawHUD);
  drawChase = wrapTiming("chase", drawChase);
}
let fpsAcc = 0, fpsN = 0;
function loop(now) {
  const raw = (now - last) / 1000;
  const dt = Math.min(raw, 0.05);
  last = now;
  if (G.state === "play") update(dt);
  else { G.player.phase += dt * 2; }
  const tRender = PROF ? performance.now() : 0;
  render();
  if (PROF) { window.__prof.draw += performance.now() - tRender; window.__prof.frames++; window.__prof.total += raw * 1000; }
  // 自适应画质：每 1.5 秒看一次真实帧率，不够就降分辨率，最多降三档
  if (G.state === "play" && qualityStrikes < 3) {
    qAcc += raw; qN++;
    if (qAcc >= 1.5) {
      if (qN / qAcc < 50) degradeQuality();
      qAcc = 0; qN = 0;
    }
  }
  if (FPSDBG) {   // 真机自检：地址加 ?fps=1，标题栏显示实时帧率
    fpsAcc += raw; fpsN++;
    if (fpsAcc >= 1) {
      G.fps = fpsN / fpsAcc;
      document.title = "fps=" + G.fps.toFixed(1)
        + " objs=" + G.objs.length + " m=" + Math.floor(G.meters);
      fpsAcc = 0; fpsN = 0;
    }
  }
  requestAnimationFrame(loop);
}

function update(dt) {
  G.t += dt;
  // 速度：随时间上升，冲刺与减速叠乘
  const ramp = Math.min(CFG.speedCap, 1 + CFG.speedStep * Math.floor(G.t / CFG.speedEvery));
  let sp = CFG.baseSpeed * H * ramp;
  if (G.boostT > 0) sp *= CFG.boostMul;
  if (G.cabT > 0) sp *= CFG.cabMul;
  if (G.slowT > 0) sp *= CFG.hurtSlow;
  G.boostT = Math.max(0, G.boostT - dt);
  G.slowT = Math.max(0, G.slowT - dt);
  G.inv = Math.max(0, G.inv - dt);
  G.cabT = Math.max(0, G.cabT - dt);
  if (G.cabT > 0) G.inv = Math.max(G.inv, 0.15);   // 冲刺期间全程免伤

  // 位移
  G.scroll = (G.scroll + sp * dt) % TILE_H;   // 防止 Scroll 无限增长
  G.meters += sp * dt / (CFG.pxPerMeter * H);

  // 转向：按住才改变方向，横移速度恒定
  const kx = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
  let dir = kx || padDir() || canvasDir;
  if (AUTO && autoTargetX != null) {
    dir = Math.abs(autoTargetX - G.player.x) < 5 ? 0 : Math.sign(autoTargetX - G.player.x);
  }
  G.player.dir = dir;
  if (dir) {
    G.player.x = clamp(G.player.x + dir * CFG.lateralSpeed * ST.w * dt,
      CFG.playPad, ST.w - CFG.playPad);
  }

  // 生成：障碍物之间强制留出垂直间距（按世界距离算），
  // 否则篱笆后面 0.2 秒就能跟一块石头，玩家没有反应空间。
  // 药材和健步散不参与这个限制，否则场面会变空。
  G.obstacleGapLeft = Math.max(0, G.obstacleGapLeft - sp * dt);
  G.spawnHerbT -= dt;
  G.spawnRockT -= dt;
  G.spawnBoostT -= dt;
  G.spawnGateT -= dt;
  G.spawnPowerT -= dt;
  const hEvery = Math.max(CFG.herbEveryMin, CFG.herbEvery - G.t * 0.004);
  const rEvery = Math.max(CFG.rockEveryMin, CFG.rockEvery - G.t * 0.008);
  if (G.spawnHerbT <= 0) { spawnHerb(); G.spawnHerbT = hEvery * rand(0.8, 1.2); }
  if (G.spawnBoostT <= 0) { spawnBoost(); G.spawnBoostT = CFG.boostEvery * rand(0.85, 1.25); }
  if (G.spawnPowerT <= 0 && G.t < CFG.catchTime - 8) { spawnPower(); G.spawnPowerT = CFG.powerEvery * rand(0.85, 1.25); }
  if (G.spawnRockT <= 0 && G.obstacleGapLeft <= 0) {
    spawnRock(); G.spawnRockT = rEvery * rand(0.85, 1.15);
    G.obstacleGapLeft = CFG.itemGap;
  }
  if (G.spawnGateT <= 0 && G.obstacleGapLeft <= 0) {
    spawnGate(); G.spawnGateT = CFG.gateEvery * rand(0.9, 1.2);
    G.obstacleGapLeft = CFG.gateGap;      // 窄口前后留更大的空档
  }

  // 物件移动与碰撞
  const P = G.player;
  G.stall = Math.max(0, G.stall - dt);
  for (let i = G.objs.length - 1; i >= 0; i--) {
    const o = G.objs[i];
    o.y -= sp * dt;
    if (o.y < -120) {
      // 篱笆滚出画面：卡住的计时还在走，只是他已经在画面外了
      if (o === G.chase.gate) G.chase.gate = null;
      G.objs.splice(i, 1); continue;
    }

    // 窄口：两段篱笆 + 中间一道缝
    if (o.type === "gate") {
      const inGap = Math.abs(P.x - o.x) < o.gapW / 2 - 4;
      // 从缝里钻过去 → 把园丁引到这道缝上卡住
      if (!o.passed && o.y <= P.y && o.y > P.y - 60) {
        o.passed = true;
        const visible = G.chase.on && G.chase.y > -20;                  // 园丁必须在屏幕里
        const busy = G.stall > 0 || G.chase.stuck || G.chase.gate;      // 卡住期间不重复触发
        if (inGap && visible && !busy) {
          // 只记下这道窄口：等它自己滚到园丁脚下，他撞上了才算卡住
          G.chase.gate = o;
        }
      }
      // 撞到两边任一段都算撞
      if (G.inv <= 0) {
        for (const seg of [o.left, o.right]) {
          const dx = seg.x - P.x, dy = o.y - P.y;
          const rr = seg.r + P.r * 0.7;
          if (dx * dx + dy * dy <= rr * rr) {
            if (hurtPlayer() && G.lives <= 0) { gameOver(false); return; }
            break;
          }
        }
      }
      continue;
    }

    const dx = o.x - P.x, dy = o.y - P.y;
    const rr = (o.r + P.r * 0.7);
    if (dx * dx + dy * dy > rr * rr) continue;
    if (o.type === "herb") {
      G.herbs++; G.herbPts += o.data.pts;
      G.fx.push({ x: o.x, y: o.y, txt: "+" + o.data.pts, life: 0.8, color: o.data.rare ? "#b03a2e" : "#3a6e4a" });
      o.data.rare ? sfx.rare() : sfx.pick();
      G.objs.splice(i, 1);
    } else if (o.type === "boost") {
      grantBoost();
      G.fx.push({ x: o.x, y: o.y, txt: "加速", life: 0.9, color: "#d98324" });
      toast("健步散！跑快一点");
      G.objs.splice(i, 1);
    } else if (o.type === "power") {
      grantPower(o.kind);
      G.objs.splice(i, 1);
    } else if (G.cabT > 0) {
      // CAB 冲刺期间：障碍直接被撞碎，还给 20 分
      G.objs.splice(i, 1);
      G.herbPts += 20;
      G.shake = 5;
      G.fx.push({ x: o.x, y: o.y, txt: "撞飞 +20", life: 0.8, color: "#d98324" });
      beep(180, 0.08, "square", 0.05, 90);
    } else if (G.inv <= 0) {
      if (hurtPlayer()) {
        if (G.lives <= 0) { gameOver(false); return; }
      }
    }
  }

  // 追兵
  if (G.mode === "challenge") {
    if (!G.chase.on && G.t >= CFG.chaseStart) {
      G.chase.on = true;
      // 进场就看得见：落在 HUD 下沿、玩家上方
      G.chase.y0 = Math.round(H * CFG.chaseInY);
      G.chase.gap = P.y - G.chase.y0;     // 世界距离：他落在你后面多少像素
      G.chase.y = G.chase.y0;
      G.chase.x = P.x; sfx.bark();
      toast("园丁放狗了！快跑");
    }
    if (G.chase.on) {
      // —— 一律按「世界距离 gap」算，不再按屏幕坐标算 ——
      //      gap' = 玩家速度 - 园丁速度
      // 所以玩家吃加速时 gap 变大 → 他在画面上真的往后退；
      // 玩家被撞减速时 gap 变小 → 他真的贴近。屏幕里看不看得见无所谓。
      const prog = clamp((G.t - CFG.chaseStart) / (CFG.catchTime - CFG.chaseStart), 0, 1);
      const k = clamp((prog - CFG.chaseRush) / (1 - CFG.chaseRush), 0, 1);
      const gSched = lerp(P.y - G.chase.y0, 12, k * k * k * k);   // 时间表上的距离
      const spNom = CFG.baseSpeed * H * ramp;                     // 基准速度（不含加速/减速）
      const boosting = G.cabT > 0 || G.boostT > 0;
      // 追赶项：把他拉回时间表。加速期间几乎不拉，让"相对速度"如实体现；
      // 越到收尾拉得越狠，保证第 catchTime 秒一定贴上。
      const pullRate = CFG.chasePull * (1 + 4 * k * k) * (boosting ? 0.2 : 1);
      const rec = clamp((G.chase.gap - gSched) * pullRate, -H * 0.55, H * 0.55);
      const vg = spNom + rec;                                     // 园丁自己的跑速
      G.chase.gap += (sp - vg) * dt;

      // 时间到点：挣脱一切（保证"第 catchTime 秒被追上"是死的）
      if (G.t >= CFG.catchTime) { G.chase.stuck = false; G.chase.gate = null; G.stall = 0; }

      // —— 撞上窄口：那道篱笆滚到园丁脚下时才会真卡住 ——
      const gt = G.chase.gate;
      const chaseY0 = P.y - G.chase.gap;
      if (gt && !G.chase.stuck && gt.y <= chaseY0 + 6 && G.t < CFG.catchTime - 4) {
        G.chase.stuck = true;
        G.stall = CFG.stallBase + CFG.stallGrow * Math.max(0, G.t - CFG.chaseStart);
        toast("园丁被篱笆卡住了！");
        beep(300, 0.2, "triangle", 0.07, 180);
      }
      if (G.chase.stuck) {
        // 挂在栅栏上 = 和栅栏保持相对静止：世界位置被钉死，
        // 于是 gap 跟场景一起变大（被甩在后面），画面里自然滚出顶部
        const st = ST.w * 1.6 * dt;
        if (gt) {
          G.chase.x += clamp(gt.x - G.chase.x, -st, st);
          G.chase.gap = P.y - (gt.y - 2);
        }
        if (G.stall <= 0) { G.chase.stuck = false; G.chase.gate = null; }
      } else {
        const st = ST.w * 0.55 * dt;
        G.chase.x += clamp(P.x - G.chase.x, -st, st);
      }
      G.chase.y = P.y - G.chase.gap + Math.sin(G.t * 5.2) * CFG.chaseBump;
      if (G.chase.gap < 26 || G.t >= CFG.catchTime) { gameOver(true); return; }
    }
  }

  // 特效
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.y -= 40 * dt; f.life -= dt;
    if (f.life <= 0) G.fx.splice(i, 1);
  }
  G.shake = Math.max(0, G.shake - dt * 40);
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 舞台外的底色：手机上舞台=整屏，这两条边是 0 宽，连填都不用填
  const sideL = ST.x, sideR = W - ST.x - ST.w;
  if (sideL > 0 || sideR > 0) {
    ctx.fillStyle = "#e9e4d8";
    if (sideL > 0) ctx.fillRect(0, 0, sideL, H);
    if (sideR > 0) ctx.fillRect(ST.x + ST.w, 0, sideR, H);
  }
  ctx.save();
  ctx.translate(ST.x, 0);
  const needClip = sideL > 0 || sideR > 0;   // 手机全宽时省掉一次 clip
  if (needClip) { ctx.beginPath(); ctx.rect(0, 0, ST.w, H); ctx.clip(); }
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake) * 0.4, rand(-G.shake, G.shake) * 0.4);

  drawGround();
  // 物件按 y 排序，远的先画
  const list = G.objs.sort((a, b) => a.y - b.y);   // 原地排序，不每帧新建数组
  for (const o of list) {
    const half = SPRITE / 2;
    if (o.type === "herb") {
      const bob = Math.sin(G.t * 2.4 + o.seed) * 2.5;
      // 影子：让药材"浮"在地面之上，和杂草区分开
      ctx.fillStyle = "rgba(70,90,65,.15)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + 15, 15, 5.5, 0, 0, 7); ctx.fill();
      if (o.data.rare) {
        ctx.fillStyle = "rgba(217,131,36,.18)";
        ctx.beginPath(); ctx.arc(o.x, o.y, 31 + Math.sin(G.t * 3) * 3, 0, 7); ctx.fill();
      }
      ctx.drawImage(herbSprite(o.data), Math.round(o.x - half),
        Math.round(o.y + bob - half), SPRITE, SPRITE);
      if (o.data.rare) {
        ctx.font = "600 11px system-ui,sans-serif"; ctx.textAlign = "center";
        ctx.fillStyle = INK; ctx.fillText(o.data.name, o.x, o.y + 32);
      }
    } else if (o.type === "boost") {
      // 健步散：金色光晕，和药材区分开
      ctx.fillStyle = "rgba(217,131,36,.22)";
      ctx.beginPath(); ctx.arc(o.x, o.y, 28 + Math.sin(G.t * 4) * 3, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(70,90,65,.15)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + 16, 14, 5, 0, 0, 7); ctx.fill();
      ctx.drawImage(boostSprite(), Math.round(o.x - half),
        Math.round(o.y + Math.sin(G.t * 3) * 2.5 - half), SPRITE, SPRITE);
      ctx.font = "600 11px system-ui,sans-serif"; ctx.textAlign = "center";
      ctx.fillStyle = "#a0571f"; ctx.fillText("加速", o.x, o.y + 30);
    } else if (o.type === "power") {
      // CAB / 农：立体字 + 一直绕竖轴自转
      const isCab = o.kind === "cab";
      const spin = G.t * 1.9 + o.seed;
      // 只用横向压缩模拟绕竖轴转，不要镜像 —— 镜像出来就是反着的"CAB"
      let face = Math.abs(Math.cos(spin));
      if (face < 0.5) face = 0.5;          // 别转到侧面成一条缝，字要始终认得出
      const col = isCab ? "#2d6cb5" : "#b8860b";
      const colDark = isCab ? "#173f6b" : "#6d5310";
      ctx.save();
      ctx.translate(o.x, o.y + Math.sin(G.t * 3) * 2.5);
      // 地面光斑 + 光环
      ctx.fillStyle = isCab ? "rgba(45,108,181,.20)" : "rgba(184,134,11,.22)";
      ctx.beginPath(); ctx.ellipse(0, 18, 26, 9, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = col; ctx.globalAlpha = 0.5; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 16, 20 + Math.sin(G.t * 4 + o.seed) * 2.5, 7, 0, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.scale(face, 1);
      const txt = isCab ? "CAB" : "农";
      ctx.font = "900 34px system-ui,'Microsoft YaHei',sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
      // 侧面：一层层往后叠，做出厚度
      for (let d = 7; d >= 1; d--) {
        ctx.fillStyle = colDark;
        ctx.fillText(txt, -d * 0.55, d * 0.85);
      }
      ctx.lineWidth = 4; ctx.strokeStyle = "#2c342e";
      ctx.strokeText(txt, 0, 0);
      ctx.fillStyle = col; ctx.fillText(txt, 0, 0);
      ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText(txt, -0.8, -0.9);
      ctx.restore();
    } else if (o.type === "gate") {
      const fs = rockSprite("fence");
      ctx.fillStyle = "rgba(60,80,55,.16)";
      for (const seg of [o.left, o.right]) {
        ctx.beginPath(); ctx.ellipse(seg.x, o.y + 14, 22, 6.5, 0, 0, 7); ctx.fill();
      }
      ctx.drawImage(fs, Math.round(o.left.x - half), Math.round(o.y - half), SPRITE, SPRITE);
      ctx.drawImage(fs, Math.round(o.right.x - half), Math.round(o.y - half), SPRITE, SPRITE);
      // 缝口画两道向内的小箭头，提示"这儿能钻过去"
      ctx.strokeStyle = "rgba(58,110,74,.55)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      const ay = Math.round(o.y);
      ctx.beginPath();
      ctx.moveTo(o.x - o.gapW / 2 + 6, ay - 7); ctx.lineTo(o.x - 10, ay); ctx.lineTo(o.x - o.gapW / 2 + 6, ay + 7);
      ctx.moveTo(o.x + o.gapW / 2 - 6, ay - 7); ctx.lineTo(o.x + 10, ay); ctx.lineTo(o.x + o.gapW / 2 - 6, ay + 7);
      ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(60,80,55,.16)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + 14, 21, 6.5, 0, 0, 7); ctx.fill();
      ctx.drawImage(rockSprite(o.data.type), Math.round(o.x - half),
        Math.round(o.y - half), SPRITE, SPRITE);
    }
  }
  drawPlayer();
  if (G.chase.on) {
    drawChase();
    // 狗越来越近时，屏幕上方泛红提示
    const danger = clamp(1 - (G.player.y - G.chase.y) / 230, 0, 1);
    if (danger > 0.05) {
      const step = Math.round(danger * 20) / 20;   // 量化后再缓存，避免每帧新建渐变
      if (!dangerGrad || dangerGradStep !== step) {
        dangerGradStep = step;
        dangerGrad = ctx.createLinearGradient(0, 0, 0, 240);
        dangerGrad.addColorStop(0, "rgba(176,58,46," + (0.34 * step).toFixed(3) + ")");
        dangerGrad.addColorStop(1, "rgba(176,58,46,0)");
      }
      ctx.fillStyle = dangerGrad; ctx.fillRect(0, 0, ST.w, 240);
    }
  }

  // 飘字
  for (const f of G.fx) {
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.font = "700 16px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y - 14);
    ctx.globalAlpha = 1;
  }
  if (G.state === "play" || G.state === "over") drawHUD();
  ctx.restore();
}

/* ---------- 自测用自动驾驶（?auto=1） ---------- */
const AUTO = new URLSearchParams(location.search).get("auto") === "1";
const WARP = +(new URLSearchParams(location.search).get("warp") || 0);
const STAY = new URLSearchParams(location.search).get("stay") === "1";
const HOLD = new URLSearchParams(location.search).get("hold") === "1";
// ?cabat=N —— 开发用：第 N 秒强制吃一个 CAB，方便验相对速度
const CABAT = +(new URLSearchParams(location.search).get("cabat") || 0);
// ?seed=N —— 开发用：固定随机数，同一 seed 每次跑到同一帧
const SEED = new URLSearchParams(location.search).get("seed");
if (SEED) {
  let s = (+SEED || 1) & 0x7fffffff;
  Math.random = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
let autoTargetX = null;

function autoSteer() {
  const P = G.player;
  // 窄口优先：从缝里钻过去（自动驾驶也只做正常人会做的事）
  for (const g of G.objs) {
    if (g.type !== "gate") continue;
    const dy = g.y - P.y;
    if (dy > -12 && dy < 260) { autoTargetX = clamp(g.x, CFG.playPad, ST.w - CFG.playPad); return; }
  }
  let best = null, bestD = 1e9;
  for (const o of G.objs) {
    if (o.type !== "rock") continue;
    const dy = P.y - o.y;
    if (dy < -20 && dy > 520) continue;
    const d = Math.abs(o.x - P.x) + Math.abs(dy) * 0.4;
    if (d < bestD) { bestD = d; best = o; }
  }
  let tx = P.x;
  if (best && Math.abs(best.x - P.x) < 130) {
    tx = best.x > ST.w / 2 ? best.x - 120 : best.x + 120;
  } else {
    let hb = null, hd = 1e9;
    for (const o of G.objs) {
      if (o.type !== "herb") continue;
      const dy = P.y - o.y;
      if (dy < -40 && dy > 420) continue;
      if (dy < hd) { hd = dy; hb = o; }
    }
    if (hb) tx = hb.x;
  }
  autoTargetX = clamp(tx, CFG.playPad, ST.w - CFG.playPad);
}

if (AUTO) {
  setInterval(() => {
    if (G.state !== "play") {
      if (G.state === "menu" || (G.state === "over" && !STAY)) start("challenge");
      return;
    }
    autoSteer();
  }, 60);
  setInterval(() => { window.__score = Math.floor(G.meters) + G.herbPts; }, 300);
}

/* ---------- 启动 ---------- */
if (new URLSearchParams(location.search).get("dbg") === "1") {
  setTimeout(() => {
    const r = document.getElementById("padR").getBoundingClientRect();
    document.title = JSON.stringify({ iw: innerWidth, ih: innerHeight, dpr: devicePixelRatio,
      padR: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)],
      stage: ST, scrollW: document.body.scrollWidth });
  }, 800);
}
resize();
drawHero();
G.player.x = ST.w / 2; G.player.dir = 0; G.player.y = H * 0.30;
// ?warp=N —— 开发用：先把 N 秒的模拟跑完再显示，方便截图与调数值
if (WARP > 0) {
  start("challenge");
  for (let i = 0; i < WARP * 60 && G.state === "play"; i++) {
    if (AUTO) autoSteer();
    if (CABAT && G.t >= CABAT && G.cabT <= 0) G.cabT = CFG.cabTime;
    update(1 / 60);
  }
}
if (HOLD) { render(); }            // ?hold=1：停在 warp 那一帧，方便截图
else requestAnimationFrame(t => { last = t; loop(t); });
</script>
</body>
</html>
